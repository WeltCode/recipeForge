# Configuración de despliegue para Render (backend Django).
# La base de datos (Neon) y el frontend (Netlify) se gestionan aparte.
services:
  - type: web
    name: recipeforge-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_ENDPOINT_URL
        sync: false
      - key: R2_PUBLIC_DOMAIN
        sync: false
      # Correo transaccional (Resend por SMTP). La API key es secreta: se pone su
      # valor en el panel de Render (Environment). Sin ella, no se envía nada y la
      # app sigue funcionando igual (el envío está gateado).
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "RecipeForge <info@recipeforge.es>"
      - key: ADMIN_NOTIFY_EMAIL
        value: "weltcode@gmail.com"
      - key: PYTHON_VERSION
        value: "3.12.6"
